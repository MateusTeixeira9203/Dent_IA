    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:14px ui-sans-serif,system-ui,sans-serif}.frame{max-width:840px;margin:40px auto;padding:24px;border:1px solid var(--border);border-radius:18px;background:var(--surface)}
