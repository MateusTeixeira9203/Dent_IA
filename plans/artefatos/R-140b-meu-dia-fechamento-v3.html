<body>
  <div class="prototype">
    <nav class="statebar" aria-label="Estados do protótipo">
      <span class="state-label">Estados v3</span>
      <button class="state-btn" data-state="empty">Vazio</button>
      <button class="state-btn" data-state="tooth" aria-pressed="true">Dente + MOD</button>
      <button class="state-btn" data-state="multi">Multidente</button>
      <button class="state-btn" data-state="general">Sem localização</button>
      <button class="state-btn" data-state="region">Região</button>
      <button class="state-btn" data-state="ortho">Manutenção</button>
      <button class="state-btn" data-state="bridge">Ausente + ponte</button>
      <button class="state-btn" data-state="dex">Dex</button>
      <button class="state-btn" data-state="edit">Editar</button>
      <button class="state-btn" data-state="canal">Canal</button>
      <button class="state-btn" data-state="error">Erro</button>
      <button class="state-btn" data-state="saved">Salvo</button>
      <button class="theme-btn" id="theme">Tema claro</button>
    </nav>

    <main class="workspace">
      <section class="patient" aria-label="Paciente atual">
        <div class="patient-left">
          <span class="time">14:30</span>
          <span class="avatar">AM</span>
          <span class="patient-name">Ana Martins</span>
          <span class="badge">34 anos</span>
          <span class="badge alert">Alergia: dipirona</span>
        </div>
        <div class="patient-meta">
          <span class="badge">2 pendências</span>
          <button class="profile">Ver perfil completo →</button>
        </div>
      </section>

      <section class="registrar" aria-label="Registrar atendimento">
        <div>
          <div class="eyebrow">Entrada livre</div>
          <div class="registrar-title">Registrar atendimento</div>
        </div>
        <div class="dex-entry">
          <div class="dex-mark">D</div>
          <div class="dex-copy">
            <strong id="dex-title">Fale, digite, cole ou use um anexo</strong>
            <span id="dex-subtitle">O Dex só organiza quando você pedir</span>
          </div>
          <button class="organize">Organizar com Dex</button>
        </div>
        <div class="entry-actions">
          <button class="ghost" data-state-jump="general">+ Procedimento</button>
          <button class="ghost" data-state-jump="edit">+ Evolução</button>
        </div>
      </section>

      <section class="bench">
        <article class="review">
          <header class="review-head">
            <h2>Revisão do atendimento</h2>
            <div class="review-meta"><span id="review-hint">edite antes de salvar</span><span class="count" id="review-count">1</span></div>
          </header>
          <div class="review-scroll" id="review-content"></div>
        </article>

        <aside class="context">
          <div class="tabs" role="tablist" aria-label="Contexto do paciente">
            <button class="tab" role="tab" data-tab="mouth" aria-selected="true">Boca</button>
            <button class="tab" role="tab" data-tab="history">Histórico</button>
            <button class="tab" role="tab" data-tab="pending">Pendências</button>
            <button class="tab" role="tab" data-tab="files">Anexos</button>
          </div>
          <div class="context-body" id="context-content"></div>
        </aside>
      </section>
    </main>

    <footer class="footer">
      <div class="footer-inner">
        <span class="footer-note" id="footer-note">Rascunho local · ainda não salvo</span>
        <button class="secondary">Marcar retorno</button>
        <button class="secondary">Gerar orçamento</button>
        <label class="check-label"><input type="checkbox"> Adicionar etiquetas depois de salvar</label>
        <button class="primary" id="save">Salvar atendimento</button>
      </div>
    </footer>
  </div>

  <script>
    const teethTop = [18,17,16,15,14,13,12,11,21,22,23,24,25,26,27,28];
    const teethBottom = [48,47,46,45,44,43,42,41,31,32,33,34,35,36,37,38];
    const allTeeth = [...teethTop, ...teethBottom];
    const state = { name: 'tooth', tab: 'mouth', selected: new Set([16]), light: false };

    const review = document.querySelector('#review-content');
    const reviewCount = document.querySelector('#review-count');
    const context = document.querySelector('#context-content');
    const save = document.querySelector('#save');
    const footerNote = document.querySelector('#footer-note');

    function record(title, anatomy, text, tone = 'done', action = '') {
      return `
        <div class="record ${tone === 'todo' ? 'indicated' : tone === 'existing' ? 'existing' : ''}">
          <div class="record-title">${title}<span class="anatomy">${anatomy}</span></div>
          <p>${text}</p>
          <div class="record-actions">
            ${action ? `<button class="icon-btn" data-open="${action}" aria-label="Abrir detalhes">↗</button>` : ''}
            <button class="icon-btn" aria-label="Editar">✎</button>
          </div>
        </div>`;
    }

    function emptyReview() {
      return `<div class="empty"><div><div class="empty-mark">+</div><strong>Nada registrado nesta consulta</strong><p>Selecione um dente, uma região, um procedimento sem localização ou use o Dex.</p></div></div>`;
    }

    function setReview(html, count, hint = 'edite antes de salvar') {
      review.innerHTML = html;
      reviewCount.textContent = String(count);
      document.querySelector('#review-hint').textContent = hint;
    }

    function toothButton(number, options = {}) {
      const classes = ['tooth'];
      if (options.selected) classes.push('selected');
      if (options.todo) classes.push('todo');
      if (options.missing) classes.push('missing');
      return `<button class="${classes.join(' ')}" data-tooth="${number}" aria-pressed="${options.selected ? 'true' : 'false'}">
        <span>${number}</span>${options.role ? `<span class="role">${options.role}</span>` : ''}
      </button>`;
    }

    function teethGrid(mode) {
      const bridgeRoles = mode === 'bridge' ? { 23: 'PILAR', 24: 'PÔNTICO', 25: 'PILAR' } : {};
      return `<div class="teeth">${allTeeth.map((number) => toothButton(number, {
        selected: state.selected.has(number),
        todo: number === 44,
        missing: number === 24,
        role: bridgeRoles[number],
      })).join('')}</div>`;
    }

    function quickEmpty() {
      return `<div class="quick-empty">
        <div class="quick-copy"><strong>Selecione um ou mais dentes</strong><span>Ou registre algo que não pertence a um dente.</span></div>
        <button class="shortcut" data-state-jump="region">Boca/arcada</button>
        <button class="shortcut" data-state-jump="ortho">Manutenção ortodôntica</button>
        <button class="shortcut" data-state-jump="general">Sem localização</button>
      </div>`;
    }

    function quickTooth(mode) {
      const count = state.selected.size;
      const anatomy = [...state.selected].sort((a, b) => a - b).join(', ');
      const bridge = mode === 'bridge';
      return `
        <div class="quick-head"><strong>${bridge ? 'Ponte fixa · papéis definidos' : count + (count === 1 ? ' dente selecionado' : ' dentes selecionados')}</strong><span>${anatomy || 'nenhum'}</span></div>
        <div class="control-row">
          <input class="search" value="${bridge ? 'Ponte fixa' : mode === 'multi' ? 'Restauração em resina' : 'Restauração em resina'}" aria-label="Procedimento">
          <button class="apply" id="apply">${bridge ? 'Aplicar ponte' : 'Aplicar'}</button>
        </div>
        <div class="mini-chips">
          <button class="chip active">Feito hoje</button><button class="chip coral">A fazer</button>
          ${bridge ? '<button class="chip active">23 pilar</button><button class="chip active">24 pôntico</button><button class="chip active">25 pilar</button>' : '<button class="chip">Canal</button><button class="chip">Coroa</button><button class="chip">Implante</button><button class="chip">Outro</button>'}
        </div>
        ${bridge ? '' : '<div class="faces"><span class="eyebrow" style="align-self:center;margin-right:3px">Faces</span><button class="chip active">M</button><button class="chip active">O</button><button class="chip active">D</button><button class="chip">V</button><button class="chip">L</button></div>'}
      `;
    }

    function mouthPanel(mode = state.name) {
      return `<div class="mouth-layout">
        <div class="mouth">
          <div class="segmented">
            <button class="seg active">Dentes/faces</button><button class="seg" data-state-jump="region">Regiões</button>
            <span class="mouth-note">${state.selected.size ? state.selected.size + ' selecionado(s)' : 'estado atual da boca'}</span>
          </div>
          ${teethGrid(mode)}
        </div>
        <div class="quick">${state.selected.size ? quickTooth(mode) : quickEmpty()}</div>
      </div>`;
    }

    function generalPanel() {
      return `<div class="panel-form">
        <div class="form-head"><button class="back" data-back-mouth>← Boca</button><strong>Procedimento sem localização</strong><span>ALVO GERAL</span></div>
        <div class="field-grid">
          <div class="field full"><label>Procedimento do catálogo ou nome livre</label><input value="Orientação de higiene e cuidados pós-operatórios"></div>
          <div class="field"><label>Status</label><input value="Feito hoje"></div>
          <div class="field"><label>Tratamento</label><input value="Consulta atual"></div>
          <div class="field full"><label>Observação opcional</label><textarea>Orientações fornecidas ao paciente e responsável.</textarea></div>
        </div>
        <button class="apply" style="width:100%;margin-top:9px">Adicionar à revisão</button>
      </div>`;
    }

    function regionPanel() {
      return `<div class="panel-form">
        <div class="form-head"><button class="back" data-back-mouth>← Dentes/faces</button><strong>Procedimento por região</strong><span>SEM PINTAR DENTE</span></div>
        <div class="region-grid">
          <button class="region">Boca toda</button><button class="region active">Arcada superior</button>
          <button class="region">Arcada inferior</button><button class="region">Quadrante</button>
        </div>
        <div class="field-grid" style="margin-top:9px">
          <div class="field full"><label>Procedimento</label><input value="Prótese total — prova dos dentes"></div>
          <div class="field"><label>Status</label><input value="Feito hoje"></div>
          <div class="field"><label>Destino</label><input value="Reabilitação superior"></div>
        </div>
        <button class="apply" style="width:100%;margin-top:9px">Adicionar à revisão</button>
      </div>`;
    }

    function orthoPanel() {
      return `<div class="panel-form">
        <div class="form-head"><button class="back" data-back-mouth>← Boca</button><strong>Manutenção ortodôntica</strong><span>CAMPOS LIVRES</span></div>
        <div class="field-grid">
          <div class="field full"><label>Arcada superior</label><textarea>Troca do arco e ativação; paciente orientado sobre uso de elástico.</textarea></div>
          <div class="field full"><label>Arcada inferior</label><textarea>Manutenção, higiene e conferência dos acessórios.</textarea></div>
          <div class="field full"><label>Observação geral — opcional</label><input value="Retorno em 30 dias"></div>
        </div>
        <button class="apply" style="width:100%;margin-top:9px">Adicionar à revisão</button>
      </div>`;
    }

    function canalPanel() {
      return `<div class="panel-form">
        <div class="form-head"><button class="back" data-back-mouth>← Voltar para a boca</button><strong>Canal · D34</strong><span>PAINEL 420 PX</span></div>
        <div class="field-grid">
          <div class="field"><label>Conduto</label><input value="MV"></div>
          <div class="field"><label>Comprimento de trabalho</label><input value="21 mm"></div>
          <div class="field"><label>Lima final</label><input value="#40"></div>
          <div class="field"><label>Substância irrigadora</label><input value="NaOCl 2,5%"></div>
          <div class="field full"><label>Evolução endodôntica</label><textarea>Instrumentação concluída e medicação intracanal realizada.</textarea></div>
        </div>
        <button class="apply" style="width:100%;margin-top:9px">Atualizar registro</button>
      </div>`;
    }

    function contextPlaceholder(title, text) {
      return `<div class="placeholder-panel"><div><strong style="display:block;color:var(--text);margin-bottom:5px">${title}</strong>${text}</div></div>`;
    }

    function renderContext() {
      document.querySelectorAll('.tab').forEach((tab) => tab.setAttribute('aria-selected', String(tab.dataset.tab === state.tab)));
      if (state.tab === 'history') context.innerHTML = contextPlaceholder('Histórico clínico', 'Consultas anteriores e ações existentes permanecem nesta mesma área fixa.');
      else if (state.tab === 'pending') context.innerHTML = contextPlaceholder('Pendências anteriores', 'O que já estava planejado pode ser puxado para “Feito hoje” preservando o ID original.');
      else if (state.tab === 'files') context.innerHTML = contextPlaceholder('Anexos do paciente', 'Arquivos reais do prontuário podem ser abertos ou usados como base para o Dex.');
      else if (state.name === 'general') context.innerHTML = generalPanel();
      else if (state.name === 'region') context.innerHTML = regionPanel();
      else if (state.name === 'ortho') context.innerHTML = orthoPanel();
      else if (state.name === 'canal') context.innerHTML = canalPanel();
      else context.innerHTML = mouthPanel();
      bindDynamic();
    }

    function renderState(name) {
      state.name = name;
      state.tab = 'mouth';
      document.querySelectorAll('.state-btn').forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.state === name)));
      document.querySelector('#dex-title').textContent = name === 'dex' ? '“Concluí o canal do 34 e indiquei coroa no 26”' : 'Fale, digite, cole ou use um anexo';
      document.querySelector('#dex-subtitle').textContent = name === 'dex' ? '2 registros organizados · revise antes de salvar' : 'O Dex só organiza quando você pedir';
      footerNote.textContent = 'Rascunho local · ainda não salvo';
      save.textContent = 'Salvar atendimento';
      save.disabled = false;

      if (name === 'empty') {
        state.selected = new Set();
        setReview(emptyReview(), 0, 'manual e Dex disponíveis');
        save.disabled = true;
      } else if (name === 'tooth') {
        state.selected = new Set([16]);
        setReview('<div class="section-label">Feito hoje</div>' + record('Restauração em resina', 'D16 MOD', 'Remoção de tecido cariado, inserção da resina e acabamento.'), 1);
      } else if (name === 'multi') {
        state.selected = new Set([16, 26, 36]);
        setReview('<div class="section-label">Feito hoje</div>' + record('Restauração em resina', 'D16 · D26 · D36', 'Aplicação em lote; cada registro permanece editável individualmente.'), 3);
      } else if (name === 'general') {
        state.selected = new Set();
        setReview('<div class="section-label">Feito hoje</div>' + record('Orientação pós-operatória', 'SEM LOCALIZAÇÃO', 'Orientações fornecidas ao paciente e responsável.'), 1);
      } else if (name === 'region') {
        state.selected = new Set();
        setReview('<div class="section-label">Feito hoje</div>' + record('Prótese total — prova dos dentes', 'ARC. SUP', 'Estética, fonética e dimensão vertical conferidas.'), 1);
      } else if (name === 'ortho') {
        state.selected = new Set();
        setReview('<div class="section-label">Feito hoje</div>' + record('Manutenção ortodôntica', 'AMBAS ARC.', 'Superior e inferior registrados em campos livres.'), 1);
      } else if (name === 'bridge') {
        state.selected = new Set([23, 24, 25]);
        setReview('<div class="section-label">A fazer</div>' + record('Ponte fixa', 'D23–D25', '23 e 25 pilares · 24 pôntico em posição ausente.', 'todo'), 1);
      } else if (name === 'dex') {
        state.selected = new Set([34]);
        setReview('<div class="section-label">Feito hoje</div>' + record('Tratamento de canal', 'D34', 'Instrumentação concluída nesta sessão.', 'done', 'canal') + '<div class="section-label">A fazer</div>' + record('Coroa total', 'D26', 'Indicada após avaliação restauradora.', 'todo'), 2);
      } else if (name === 'edit') {
        state.selected = new Set([26]);
        setReview(`<div class="section-label">Feito hoje</div>
          <div class="record">
            <div class="record-title">Evolução clínica<span class="anatomy">SEM LOCALIZAÇÃO</span></div>
            <textarea style="width:100%;height:48px;margin-top:7px;border:1px solid var(--teal);border-radius:7px;background:var(--surface);color:var(--text);padding:7px;font:inherit;font-size:9px">Paciente retornou para controle e retirada dos pontos. Cicatrização dentro do esperado.</textarea>
          </div>`, 1, 'edição altera o payload');
      } else if (name === 'canal') {
        state.selected = new Set([34]);
        setReview('<div class="section-label">Feito hoje</div>' + record('Tratamento de canal', 'D34', 'Clique no card para editar os dados endodônticos.', 'done', 'canal'), 1);
      } else if (name === 'error') {
        state.selected = new Set([16]);
        setReview('<div class="error-banner"><strong>Não foi possível salvar.</strong> O rascunho foi preservado. Tente novamente sem repetir o atendimento.</div><div class="section-label">Feito hoje</div>' + record('Restauração em resina', 'D16 MOD', 'Nenhuma informação foi perdida.'), 1, 'rascunho preservado');
        footerNote.textContent = 'Falha de conexão · nada foi descartado';
      } else if (name === 'saved') {
        state.selected = new Set();
        setReview('<div class="success-banner"><strong>Atendimento salvo.</strong> Ficha, evolução e perfil do paciente foram atualizados.</div>' + emptyReview(), 0, 'pronto para o próximo paciente');
        footerNote.textContent = 'Atendimento finalizado · perfil revalidado';
        save.textContent = 'Atendimento salvo';
        save.disabled = true;
      }
      renderContext();
      bindReviewActions();
    }

    function bindDynamic() {
      context.querySelectorAll('[data-tooth]').forEach((button) => button.addEventListener('click', () => {
        const number = Number(button.dataset.tooth);
        if (state.selected.has(number)) state.selected.delete(number); else state.selected.add(number);
        renderContext();
      }));
      context.querySelectorAll('[data-state-jump]').forEach((button) => button.addEventListener('click', () => renderState(button.dataset.stateJump)));
      context.querySelectorAll('[data-back-mouth]').forEach((button) => button.addEventListener('click', () => {
        state.name = state.selected.size > 1 ? 'multi' : state.selected.size === 1 ? 'tooth' : 'empty';
        renderContext();
      }));
      const apply = context.querySelector('#apply');
      if (apply) apply.addEventListener('click', () => {
        const anatomy = [...state.selected].sort((a, b) => a - b).map((d) => 'D' + d).join(' · ');
        setReview('<div class="section-label">Feito hoje</div>' + record(state.name === 'bridge' ? 'Ponte fixa' : 'Restauração em resina', state.name === 'bridge' ? 'D23–D25' : anatomy + ' MOD', state.name === 'bridge' ? '23 e 25 pilares · 24 pôntico em posição ausente.' : 'Aplicado pelo acesso rápido; editável antes de salvar.', state.name === 'bridge' ? 'todo' : 'done'), state.selected.size || 1);
      });
    }

    function bindReviewActions() {
      review.querySelectorAll('[data-open="canal"]').forEach((button) => button.addEventListener('click', () => {
        state.name = 'canal';
        state.tab = 'mouth';
        renderContext();
      }));
    }

    document.querySelectorAll('.state-btn').forEach((button) => button.addEventListener('click', () => renderState(button.dataset.state)));
    document.querySelectorAll('[data-state-jump]').forEach((button) => button.addEventListener('click', () => renderState(button.dataset.stateJump)));
    document.querySelectorAll('.tab').forEach((button) => button.addEventListener('click', () => { state.tab = button.dataset.tab; renderContext(); }));
    document.querySelector('#theme').addEventListener('click', (event) => {
      state.light = !state.light;
      document.documentElement.dataset.theme = state.light ? 'light' : 'dark';
      event.currentTarget.textContent = state.light ? 'Tema escuro' : 'Tema claro';
    });
    save.addEventListener('click', () => renderState('saved'));
    renderState('tooth');
  </script>
</body>
</html>
