<!-- ARTEFATO · R-138 · rota: /dashboard/agendamentos · componente: week-view.tsx e day-view.tsx · 2026-08-27 · status: direção confirmada — porta a grade desktop para o celular -->
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>R-138 · Agenda mobile</title>
  <style>
    :root { --bg:#0d0d0d; --surface:#111112; --alt:#1c1c1e; --border:#2e2e32; --text:#fafafa; --muted:#a1a1aa; --teal:#2f9c85; --teal-dark:#1f7564; --busy:#303944; }
    * { box-sizing:border-box } body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font-family:Arial,sans-serif; padding:24px 12px }
    .phone { width:min(100%,390px); margin:auto; overflow:hidden; border:1px solid var(--border); border-radius:18px; background:var(--surface) }
    header { display:flex; align-items:center; justify-content:space-between; padding:16px; border-bottom:1px solid var(--border) } h1 { margin:0; font:600 22px Georgia,serif } .x{ color:var(--muted); font-size:24px }
    .switcher,.nav { display:flex; align-items:center; gap:8px; padding:12px 14px; border-bottom:1px solid var(--border) } .switcher button,.nav button { min-height:40px; border:1px solid var(--border); border-radius:9px; background:var(--alt); color:var(--muted); font-weight:700 } .switcher button { flex:1 } .switcher .active { background:rgba(47,156,133,.12); border-color:var(--teal); color:var(--teal) } .nav button { width:40px; font-size:21px } .nav p { flex:1; margin:0; text-align:center; font-size:12px; font-weight:700 }
    .calendar { overflow:auto; max-height:590px; overscroll-behavior:contain } .week { min-width:380px } .head,.row { display:grid; grid-template-columns:28px repeat(7,minmax(44px,1fr)) } .head { position:sticky; top:0; z-index:2; background:var(--surface); border-bottom:1px solid var(--border) } .head div { min-height:48px; display:grid; place-items:center; border-left:1px solid var(--border); color:var(--muted); font-size:9px; font-weight:700; text-transform:uppercase } .head strong { display:block; color:var(--text); font-size:14px; line-height:1.1 } .head .today strong { color:var(--teal) }
    .row { height:48px; position:relative } .hour { padding-top:3px; color:var(--muted); font:9px monospace; text-align:right; padding-right:4px } .cell { position:relative; border-left:1px solid var(--border); border-bottom:1px solid rgba(46,46,50,.7) } .busy { position:absolute; inset:3px 2px auto; height:38px; overflow:hidden; border:1px solid #526170; border-radius:4px; background:var(--busy); color:#d7e0e8; font-size:8px; line-height:12px; padding:3px; white-space:nowrap } .selected { position:absolute; inset:3px 2px auto; height:38px; border-radius:4px; background:var(--teal-dark); color:white; padding:12px 2px 0; font:bold 8px monospace; text-align:center }
    footer { display:flex; gap:8px; padding:12px 14px; border-top:1px solid var(--border); background:var(--surface) } footer button { flex:1; min-height:44px; border-radius:10px; border:1px solid var(--border); background:transparent; color:var(--text); font-weight:700 } footer .primary { background:var(--teal-dark); border-color:var(--teal-dark) }
  </style>
</head>
<body>
  <main class="phone" aria-label="Agenda mobile em visão de semana">
    <header><h1>Agenda</h1><span class="x">×</span></header>
    <div class="switcher"><button>Dia</button><button class="active">Semana</button></div>
    <div class="nav"><button>‹</button><p>23 ago – 29 ago</p><button>›</button></div>
    <section class="calendar" aria-label="Grade semanal"><div class="week">
      <div class="head"><div></div><div>Dom<strong>23</strong></div><div>Seg<strong>24</strong></div><div>Ter<strong>25</strong></div><div>Qua<strong>26</strong></div><div class="today">Qui<strong>27</strong></div><div>Sex<strong>28</strong></div><div>Sáb<strong>29</strong></div></div>
      <div class="row"><div class="hour">08h</div><div class="cell"></div><div class="cell"><span class="busy">08:00<br>Ana</span></div><div class="cell"></div><div class="cell"></div><div class="cell"><span class="selected">08:00</span></div><div class="cell"></div><div class="cell"></div></div>
      <div class="row"><div class="hour">09h</div><div class="cell"></div><div class="cell"></div><div class="cell"><span class="busy">09:00<br>João</span></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div></div>
      <div class="row"><div class="hour">10h</div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"><span class="busy">10:00<br>Luiz</span></div><div class="cell"></div></div>
      <div class="row"><div class="hour">11h</div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"><span class="busy">11:00<br>Bia</span></div><div class="cell"></div><div class="cell"></div><div class="cell"></div></div>
      <div class="row"><div class="hour">12h</div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div></div>
      <div class="row"><div class="hour">13h</div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div></div>
      <div class="row"><div class="hour">14h</div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div></div>
      <div class="row"><div class="hour">15h</div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div></div>
    </div></section>
    <footer><button>Hoje</button><button class="primary">+ Agendamento</button></footer>
  </main>
</body>
</html>
