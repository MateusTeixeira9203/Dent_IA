<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Odonto.IA — Landing V7</title>
</head>
<body>
<script>
/*
 * A V7 preserva a V6 e troca somente o odontograma demonstrativo.
 * Famílias e orientação portadas de tooth-geometry.ts: molar com duas raízes,
 * pré-molar, canino e incisivo com silhuetas próprias; superiores têm raízes
 * para cima e inferiores, para baixo.
 */
const upper=[18,17,16,15,14,13,12,11,21,22,23,24,25,26,27,28];
const lower=[48,47,46,45,44,43,42,41,31,32,33,34,35,36,37,38];
const clinical={16:'done',26:'old',46:'todo',36:'old',37:'todo'};

function family(n){
  const p=n%10;
  return p>=6?'molar':p>=4?'premolar':p===3?'canine':'anterior';
}

/* Paths normalizados da mesma gramática anatômica usada em produção. */
const anatomy={
  anterior:{
    root:'M12 34 C12 24 14 15 18 3 C19 0 21 0 22 3 C26 15 28 24 28 34 Z',
    crown:'M12 34 C10 45 7 59 8 73 Q20 78 32 73 C33 59 30 45 28 34 Z'
  },
  canine:{
    root:'M11 35 C12 24 15 12 18 2 Q20 -1 22 2 C25 12 28 24 29 35 Z',
    crown:'M11 35 C9 49 8 63 20 78 C32 63 31 49 29 35 Z'
  },
  premolar:{
    root:'M10 34 C11 23 14 13 18 3 Q20 0 22 3 C26 13 29 23 30 34 Z',
    crown:'M10 34 C8 47 5 62 8 72 Q13 77 20 72 Q27 77 32 72 C35 62 32 47 30 34 Z'
  },
  molar:{
    root:'M7 35 C8 27 8 18 10 10 C11 4 14 0 16 1 C19 5 18 17 18 23 C18 27 22 27 22 23 C22 17 21 5 24 1 C27 0 29 4 30 10 C32 18 32 27 33 35 Z',
    crown:'M7 35 C5 47 3 61 6 70 Q10 77 15 72 Q20 78 25 72 Q30 77 34 70 C37 61 35 47 33 35 Z'
  }
};

function tooth(n,isUpper){
  const f=family(n),a=anatomy[f],state=clinical[n]||'neutral';
  const color=state==='done'?'#35b59d':state==='todo'?'#ef9aa2':state==='old'?'#aab8ca':'#1b1d1e';
  const stroke=state==='done'?'#53c9b4':state==='todo'?'#f1a8ae':state==='old'?'#bec8d5':'#35383a';
  const transform=isUpper?'':'rotate(180 20 39)';
  return `<span class="anatomicalTooth ${f}">
    ${isUpper?`<small>${n}</small>`:''}
    <svg viewBox="0 0 40 79" role="img" aria-label="Dente ${n}">
      <g transform="${transform}">
        <path d="${a.root}" fill="#17191a" stroke="#303335" stroke-width="1"/>
        <path d="${a.crown}" fill="${color}" stroke="${stroke}" stroke-width="1.2"/>
      </g>
    </svg>
    ${isUpper?'':`<small>${n}</small>`}
  </span>`;
}

function upgradeOdontogram(){
  document.querySelectorAll('.arches').forEach(arch=>{
    const rows=arch.querySelectorAll('.teeth');
    if(rows[0]){rows[0].classList.add('anatomical');rows[0].innerHTML=upper.map(n=>tooth(n,true)).join('')}
    if(rows[1]){rows[1].classList.add('anatomical');rows[1].innerHTML=lower.map(n=>tooth(n,false)).join('')}
  });
}

fetch('./R-121-landing-conversao-v6.html').then(r=>r.text()).then(html=>{
  const parsed=new DOMParser().parseFromString(html,'text/html');
  document.head.replaceWith(parsed.head);
  document.body.replaceWith(parsed.body);
  document.title='Odonto.IA — Landing V7';
  const style=document.createElement('style');
  style.textContent=`
    .teeth.anatomical{height:102px;gap:1px;align-items:center;overflow:visible}
    .anatomicalTooth{flex:1 1 0;min-width:0;height:99px;display:flex;flex-direction:column;align-items:center;justify-content:center}
    .anatomicalTooth.molar{flex-grow:1.25}.anatomicalTooth.premolar{flex-grow:1.08}
    .anatomicalTooth svg{display:block;width:100%;max-width:40px;height:80px;overflow:visible}
    .anatomicalTooth small{height:9px;color:#777d80;font:600 6px/1 var(--sans);letter-spacing:0}
    @media(max-width:680px){
      .teeth.anatomical{height:76px;gap:0}
      .anatomicalTooth{height:74px}.anatomicalTooth svg{height:58px}
      .anatomicalTooth small{font-size:5px;height:7px}
    }
  `;
  document.head.appendChild(style);
  upgradeOdontogram();
});
</script>
</body>
</html>
