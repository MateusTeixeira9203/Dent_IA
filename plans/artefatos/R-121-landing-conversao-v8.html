<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Odonto.IA — Landing V8</title>
  <style>
    html,body,#stage{width:100%;height:100%;margin:0;border:0;background:#0d0e0e;overflow:hidden}
  </style>
</head>
<body>
<iframe id="stage" src="./R-121-landing-conversao-v7.html" title="Landing Odonto.IA V8"></iframe>
<script>
const stage=document.querySelector('#stage');
stage.addEventListener('load',()=>{
  const doc=stage.contentDocument;
  const wait=setInterval(()=>{
    const card=doc.querySelector('.heroProduct');
    if(!card||!doc.querySelector('.anatomicalTooth'))return;
    clearInterval(wait);
    card.innerHTML=`
      <div class="win"><i></i><i></i><i></i><span>ODONTO.IA · FICHA DA CONSULTA</span></div>
      <div class="realMagic">
        <div class="magicHead">
          <span class="dexDot">Ⅱ</span>
          <b>CAMPO MÁGICO</b>
          <small>Fale, cole ou anexe — o Dex monta a ficha</small>
        </div>
        <div class="magicChips">
          <span class="localChip">ϟ Restauração · dente 16</span>
          <span class="detectedChip">Próxima sessão · dente 46</span>
        </div>
        <div class="magicText">Paciente relatou dor no dente 16. Fiz restauração com resina composta. O 46 fica para a próxima sessão.</div>
        <div class="magicBar">
          <div><span class="voice">◉ &nbsp;Gravar voz</span><span class="attach">⌕ &nbsp;Anexar</span></div>
          <button><span>▣</span> Organizar com Dex <kbd>Ctrl ↵</kbd></button>
        </div>
      </div>
      <div class="structuredHead"><span>FICHA ESTRUTURADA</span><small>resultado do relato</small></div>
      <div class="heroResults">
        <div class="result"><div><b>Restauração · dente 16</b><small>Resina composta · realizado hoje</small></div><span class="tag">REALIZADO</span></div>
        <div class="result"><div><b>Restauração · dente 46</b><small>Material, técnica e intercorrência podem ser revisados</small></div><span class="tag next">PRÓXIMA SESSÃO</span></div>
      </div>
      <footer>Você revisa antes de salvar. A decisão clínica é sempre sua.</footer>`;

    const style=doc.createElement('style');
    style.textContent=`
      .heroProduct{overflow:hidden}
      .realMagic{margin:16px 18px 10px;border:1px solid color-mix(in srgb,var(--teal) 34%,transparent);border-radius:15px;background:color-mix(in srgb,var(--teal) 5%,var(--card));overflow:hidden}
      .magicHead{display:flex;align-items:center;gap:8px;padding:11px 13px 7px}
      .dexDot{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--teal);color:#07110f;font:800 9px/1 var(--sans)}
      .magicHead b{color:var(--teal-2);font:800 10px/1 var(--sans);letter-spacing:.16em}
      .magicHead small{color:var(--muted);font:500 10px/1.2 var(--sans)}
      .magicChips{display:flex;flex-wrap:wrap;gap:6px;padding:0 13px 5px}
      .magicChips span{padding:4px 7px;border-radius:6px;font:650 8px/1 var(--sans)}
      .localChip{background:var(--teal);color:#07110f}.detectedChip{border:1px solid color-mix(in srgb,var(--teal) 35%,transparent);background:color-mix(in srgb,var(--teal) 9%,transparent);color:var(--teal-2)}
      .magicText{min-height:47px;padding:7px 13px 10px;color:var(--text);font:500 11px/1.55 var(--sans)}
      .magicBar{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding:8px 10px}
      .magicBar>div{display:flex;align-items:center;gap:5px}.voice,.attach{display:inline-flex;padding:6px 8px;border-radius:8px;color:var(--muted);font:700 8px/1 var(--sans)}
      .voice{background:color-mix(in srgb,var(--teal) 12%,transparent);color:var(--teal-2)}
      .magicBar button{border:0;border-radius:10px;background:var(--teal);color:#07110f;padding:8px 10px;font:800 9px/1 var(--sans);box-shadow:0 0 14px color-mix(in srgb,var(--teal) 27%,transparent)}
      .magicBar kbd{margin-left:4px;opacity:.62;font:600 7px/1 var(--mono)}
      .structuredHead{display:flex;align-items:center;justify-content:space-between;margin:8px 18px;color:var(--teal-2);font:700 9px/1 var(--mono);letter-spacing:.12em}.structuredHead small{color:var(--muted);font:500 8px/1 var(--sans);letter-spacing:0}
      .heroResults{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 18px 14px}.heroResults .result{margin:0;min-width:0;padding:11px}.heroResults .result b{font-size:10px}.heroResults .result small{font-size:8px}.heroResults .tag{font-size:7px;white-space:nowrap}.heroResults .tag.next{color:#efb66f;border-color:#9b612d;background:#332113}
      .heroProduct footer{padding:10px 18px}
      @media(max-width:680px){
        .realMagic{margin:13px 12px 8px}.magicHead{align-items:flex-start;flex-wrap:wrap}.magicHead small{width:calc(100% - 32px);margin-left:30px;margin-top:-5px}.magicBar{align-items:stretch;flex-direction:column}.magicBar button{width:100%;padding:10px}.structuredHead{margin:10px 12px}.heroResults{grid-template-columns:1fr;margin:0 12px 12px}.heroProduct footer{padding:10px 12px}
      }
    `;
    doc.head.appendChild(style);
  },40);
});
</script>
</body>
</html>
