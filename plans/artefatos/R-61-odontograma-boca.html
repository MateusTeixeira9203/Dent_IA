<!--
  ARTEFATO — R-61 · odontograma do Meu dia mostra a boca
  Item alvo:       R-61 (plans/specs/R-61-odontograma-mostra-a-boca.md) §2.3
  Rota alvo:       /dashboard/meu-dia
  Componente alvo: src/components/odontograma/Odontograma.tsx (ToothSVG)
  Data:            2026-08-05
  Status:          proposta — responde "o que é a opção A", com 2 variantes da MARCA
  Tokens:          copiados de src/app/globals.css (:root e .dark), não deduzidos
  Geometria:       proporções de tooth-geometry.ts aproximadas p/ leitura; o artefato
                   NÃO porta o algoritmo real de path (não é o ponto aqui — o ponto é a
                   marca aditiva). Ver plans/handoffs (22/07) sobre esse risco.
-->
<style>
  :root {
    --color-teal: #2f9c85; --color-teal-lt: #5dbeb0; --color-teal-pale: #e4f4f1;
    --color-teal-dark: #1e7060; --color-teal-ink: #1e7060;
    --color-coral: #e57373; --color-coral-pale: #fce8e8; --color-coral-ink: #b3261e;
    --color-slate: #64748b; --color-slate-pale: #e2e8f0; --color-slate-ink: #334155;
    --color-bg: #f4f4f6; --color-surface: #ffffff; --color-surface-alt: #dadade;
    --color-border: #c2c2c6; --color-text-primary: #09090b;
    --color-text-secondary: #4b5563; --color-text-muted: #6b7280;
  }
  .dark {
    --color-teal-pale: #1e3a35; --color-teal-ink: var(--color-teal-lt);
    --color-coral: #ef9a9a; --color-coral-pale: #3d1f1f; --color-coral-ink: #ef9a9a;
    --color-slate: #94a3b8; --color-slate-pale: #334155; --color-slate-ink: #94a3b8;
    --color-bg: #0d0d0d; --color-surface: #111112; --color-surface-alt: #1c1c1e;
    --color-border: #27272a; --color-text-primary: #fafafa;
    --color-text-secondary: #a1a1aa; --color-text-muted: #8d948d;
  }
  body { margin: 0; font-family: ui-sans-serif, system-ui, sans-serif; }
  .pane { background: var(--color-bg); color: var(--color-text-primary); padding: 28px 24px 34px; }
  h1 { font-size: 13px; letter-spacing: .09em; text-transform: uppercase; margin: 0 0 4px;
       color: var(--color-text-secondary); font-weight: 800; }
  .sub { font-size: 12px; color: var(--color-text-muted); margin: 0 0 22px; }
  .card { background: var(--color-surface); border: 1px solid var(--color-border);
          border-radius: 18px; padding: 18px 20px 14px; margin-bottom: 18px; }
  .card > h2 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
               color: var(--color-text-secondary); font-weight: 800; margin: 0 0 3px; }
  .card > p { font-size: 12px; color: var(--color-text-muted); margin: 0 0 14px; line-height: 1.5; }
  .arch { display: flex; gap: 2px; align-items: flex-start; }
  .cell { position: relative; display: flex; flex-direction: column; align-items: center; width: 44px; }
  .num { font-family: ui-monospace, monospace; font-size: 10px; margin-top: 3px;
         color: var(--color-text-secondary); }
  .lab { font-size: 9px; line-height: 1.25; text-align: center; margin-top: 5px;
         color: var(--color-text-muted); max-width: 46px; }
  .dot { position: absolute; top: -3px; right: 5px; width: 9px; height: 9px;
         border-radius: 50%; background: var(--color-teal);
         border: 1.6px solid var(--color-surface); }
  .num.mark { color: var(--color-teal-ink); font-weight: 800;
              border-bottom: 2px solid var(--color-teal); padding-bottom: 1px; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 14px;
            padding-top: 12px; border-top: 1px solid var(--color-border); }
  .legend span { font-size: 10.5px; color: var(--color-text-secondary);
                 display: inline-flex; align-items: center; gap: 5px; }
  .sw { width: 11px; height: 11px; border-radius: 3px; border: 1px solid; }
</style>

<script>
  // Um dente = coroa (trapézio) + raiz. Cores vêm dos tokens, nunca hardcoded.
  // fill segue CROWN_FILL do componente: coral→-pale · teal→mix 24% · slate→-pale
  const CROWN_FILL = {
    coral: 'var(--color-coral-pale)',
    teal:  'color-mix(in srgb, var(--color-teal) 24%, var(--color-surface-alt))',
    slate: 'var(--color-slate-pale)',
    none:  'var(--color-surface-alt)',
  };
  const STROKE = {
    coral: 'var(--color-coral)', teal: 'var(--color-teal)',
    slate: 'var(--color-slate)', none: 'var(--color-border)',
  };

  function tooth(cor, opts = {}) {
    const dots = cor === 'slate';
    const id = 'p' + Math.random().toString(36).slice(2, 8);
    return `<svg width="40" height="66" viewBox="0 0 40 66">
      ${dots ? `<defs><pattern id="${id}" width="4" height="4" patternUnits="userSpaceOnUse">
        <circle cx="1" cy="1" r="0.8" fill="var(--color-surface)"/></pattern></defs>` : ''}
      <path d="M8 40 L11 62 Q14 65 16 62 L18 40 Z" fill="${CROWN_FILL[cor]}"
            stroke="${STROKE[cor]}" stroke-width="1.3"/>
      <path d="M22 40 L24 62 Q26 65 29 62 L32 40 Z" fill="${CROWN_FILL[cor]}"
            stroke="${STROKE[cor]}" stroke-width="1.3"/>
      <path d="M5 12 Q5 4 20 4 Q35 4 35 12 L35 34 Q35 41 20 41 Q5 41 5 34 Z"
            fill="${CROWN_FILL[cor]}" stroke="${STROKE[cor]}" stroke-width="1.5"/>
      ${dots ? `<path d="M5 12 Q5 4 20 4 Q35 4 35 12 L35 34 Q35 41 20 41 Q5 41 5 34 Z"
            fill="url(#${id})" stroke="none"/>` : ''}
      ${opts.canal ? `<path d="M13 40 L14.5 60 M27 40 L26 60" fill="none"
            stroke="${STROKE[cor]}" stroke-width="1.7" stroke-linecap="round"/>` : ''}
    </svg>`;
  }

  function cell(num, cor, label, marca) {
    const dot   = marca === 'dot'  ? '<span class="dot"></span>' : '';
    const sub   = marca === 'num'  ? ' mark' : '';
    return `<div class="cell">${dot}${tooth(cor, { canal: cor === 'teal' })}
      <span class="num${sub}">${num}</span><span class="lab">${label}</span></div>`;
  }

  const ARCO = (marca) => [
    cell(16, 'coral', 'aberto<br>(prontuário)', null),
    cell(15, 'teal',  'feito antes', null),
    cell(14, 'slate', 'pré-existente', null),
    cell(13, 'none',  'sem registro', null),
    cell(12, 'coral', 'ACHEI AGORA', marca),
    cell(11, 'teal',  'FIZ AGORA', marca),
  ].join('');

  const LEGENDA = `<div class="legend">
    <span><i class="sw" style="background:var(--color-coral-pale);border-color:var(--color-coral)"></i>a fazer</span>
    <span><i class="sw" style="background:color-mix(in srgb,var(--color-teal) 24%,var(--color-surface-alt));border-color:var(--color-teal)"></i>feito aqui</span>
    <span><i class="sw" style="background:var(--color-slate-pale);border-color:var(--color-slate)"></i>pré-existente</span>
    <span><i class="sw" style="background:var(--color-teal);border-color:var(--color-teal);border-radius:50%"></i>mexido nesta sessão</span>
  </div>`;

  // §6 do artefato — matriz completa que o §5 da spec pede: os 6 estados que a
  // implementação precisa distinguir, opção A (decidida) já aplicada.
  function matriz() {
    return [
      cell(17, 'coral', 'persistido<br>aberto', null),
      cell(16, 'teal',  'persistido<br>feito antes', null),
      cell(15, 'slate', 'pré-existente', null),
      cell(14, 'coral', 'só rascunho<br>(achei agora)', 'dot'),
      cell(13, 'teal',  'nas 2 camadas<br>(fiz hoje o que<br>era pendência)', 'dot'),
      cell(12, 'none',  'ausente/sem<br>registro', null),
    ].join('');
  }

  function pane(dark) {
    return `<div class="pane${dark ? ' dark' : ''}"${dark ? ' style="background:var(--color-bg)"' : ''}>
      <h1>R-61 · opção A — ${dark ? 'dark' : 'light'}</h1>
      <p class="sub">A boca inteira pinta com a paleta de sempre. Só o que foi mexido
        NESTA sessão ganha marca. Nenhuma cor nova, nenhum canal existente tocado.</p>
      <div class="card"><h2>Matriz completa (§5/§6 da spec)</h2>
        <p>Os 6 estados que a implementação precisa distinguir. O 5º dente (13) é o caso do
           dedup §4.3: pendência antiga + "fazer hoje →" no draft — mesmo <code>id</code> nas
           duas camadas, draft vence a cor (teal), ponto mostra que foi mexido agora.</p>
        <div class="arch">${matriz()}</div>${LEGENDA}</div>
      <div class="card"><h2>A1 — ponto no canto (decidida)</h2>
        <p>Marca aditiva, fora do dente. Não disputa com o anel de seleção (que é stroke no dente),
           nem com tracejado/textura (já ocupados por incluso, ausente e pré-existente).</p>
        <div class="arch">${ARCO('dot')}</div>${LEGENDA}</div>
      <div class="card"><h2>A2 — número sublinhado (descartada)</h2>
        <p>Marca no rótulo, não no desenho. Zero pixel novo sobre o dente — mas some
           quando o dentista olha só as formas.</p>
        <div class="arch">${ARCO('num')}</div>${LEGENDA}</div>
      <div class="card"><h2>Hoje, pra comparar</h2>
        <p>Só o rascunho da sessão é pintado. Tudo que o paciente já tinha fica invisível.</p>
        <div class="arch">${[
          cell(16, 'none', '—', null), cell(15, 'none', '—', null),
          cell(14, 'none', '—', null), cell(13, 'none', '—', null),
          cell(12, 'coral', 'achei agora', null), cell(11, 'teal', 'fiz agora', null),
        ].join('')}</div></div>
    </div>`;
  }

  // Não usar `body.innerHTML =` aqui: este script ainda está sendo parseado dentro do body,
  // e a atribuição remove o próprio nó em execução (resultado: página em branco, sem erro
  // no console — medido ao vivo 05/08). Espera o parse terminar e só então injeta.
  addEventListener('DOMContentLoaded', () => {
    const raiz = document.createElement('div');
    raiz.innerHTML = pane(false) + pane(true);
    document.body.appendChild(raiz);
  });
</script>
