<!--
  ARTEFATO · R-04 (revisão) — Encaminhar procedimento em LOTE
  Item:            R-04 reaberto — encaminhar por-card → lote (seleciona N → 1 destino)
  Rota alvo:       /dashboard/pacientes/[id]  (aba Fichas)
  Componente alvo: novo EncaminharLote + RegistroCard (mantém só o badge só-leitura)
  Data:            2026-07-24
  Status:          EXPLORAÇÃO — design-shotgun, 4 direções de INTERAÇÃO (não paleta nova)
  Tokens:          extraídos de src/app/globals.css (claro + escuro) — fiéis, não aproximados
  Caso de uso:     sênior passa "quase a ficha toda" (simples) e fica com implante/complexo;
                   gesto real = "seleciona tudo, tira os poucos que eu fico". 1 só também fácil.
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R-04 · Encaminhar em lote — 4 direções</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root, [data-theme="light"] {
    --bg:#f4f4f6; --surface:#ffffff; --surface-alt:#dadade; --border:#e2e2e5; --border-strong:#c2c2c6;
    --text-1:#09090b; --text-2:#4b5563; --text-3:#6b7280;
    --teal:#2f9c85; --teal-lt:#5dbeb0; --teal-pale:#e4f4f1; --teal-ink:#1e7060;
    --coral:#e57373; --coral-pale:#fce8e8; --coral-ink:#b3261e;
    --slate:#64748b; --slate-pale:#e2e8f0; --slate-ink:#334155;
    --shadow: 0 1px 2px rgba(9,9,11,.04), 0 8px 24px rgba(9,9,11,.08);
    --scrim: rgba(9,9,11,.32);
  }
  [data-theme="dark"] {
    --bg:#09090b; --surface:#111112; --surface-alt:#1c1c1e; --border:#27272a; --border-strong:#3a3a3d;
    --text-1:#fafafa; --text-2:#a1a1aa; --text-3:#8b8b93;
    --teal:#2f9c85; --teal-lt:#5dbeb0; --teal-pale:#1e3a35; --teal-ink:#5dbeb0;
    --coral:#ef9a9a; --coral-pale:#3d1f1f; --coral-ink:#ef9a9a;
    --slate:#94a3b8; --slate-pale:#334155; --slate-ink:#94a3b8;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.5);
    --scrim: rgba(0,0,0,.55);
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    font-family:'Outfit',system-ui,sans-serif; background:var(--bg); color:var(--text-1);
    -webkit-font-smoothing:antialiased; transition:background .3s,color .3s; padding-bottom:120px;
  }
  .mono { font-family:'DM Mono',ui-monospace,monospace; }

  /* ── topbar ─────────────────────────────────────── */
  .topbar {
    position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:16px;
    padding:12px 20px; background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:blur(8px); border-bottom:1px solid var(--border); flex-wrap:wrap;
  }
  .topbar h1 { font-size:13px; font-weight:700; letter-spacing:-.01em; }
  .topbar .sub { font-size:11px; color:var(--text-3); font-weight:500; }
  .tabs { display:flex; gap:4px; background:var(--surface-alt); padding:4px; border-radius:12px; }
  .tab {
    border:0; background:transparent; color:var(--text-2); font-family:inherit; font-size:12px;
    font-weight:600; padding:6px 12px; border-radius:9px; cursor:pointer; transition:.15s; white-space:nowrap;
  }
  .tab.on { background:var(--surface); color:var(--text-1); box-shadow:0 1px 2px rgba(0,0,0,.08); }
  .tab .k { font-size:10px; color:var(--text-3); }
  .spacer { flex:1; }
  .ghost-btn {
    border:1px solid var(--border-strong); background:var(--surface); color:var(--text-2);
    font-family:inherit; font-size:12px; font-weight:600; padding:6px 12px; border-radius:10px; cursor:pointer;
  }

  /* ── concept strip ──────────────────────────────── */
  .concept {
    max-width:760px; margin:20px auto 0; padding:0 20px; display:flex; gap:12px; align-items:flex-start;
  }
  .concept .dot { width:8px; height:8px; border-radius:50%; background:var(--teal); margin-top:6px; flex:none; }
  .concept h2 { font-size:15px; font-weight:700; letter-spacing:-.01em; }
  .concept p { font-size:12.5px; color:var(--text-2); margin-top:3px; line-height:1.5; }
  .concept .ref { font-size:11px; color:var(--text-3); margin-top:4px; }

  /* ── ficha (fundo compartilhado) ────────────────── */
  .stage { max-width:760px; margin:18px auto 0; padding:0 20px; }
  .ficha { background:var(--surface); border:1px solid var(--border); border-radius:18px; overflow:hidden; box-shadow:var(--shadow); }
  .ficha-head { display:flex; align-items:center; gap:12px; padding:16px 18px; border-bottom:1px solid var(--border); }
  .ficha-head .who { min-width:0; flex:1; }
  .ficha-head .who .n { font-size:14px; font-weight:700; }
  .ficha-head .who .s { font-size:11.5px; color:var(--text-3); margin-top:1px; }
  .entry-btn {
    display:inline-flex; align-items:center; gap:7px; border:1px solid var(--teal); background:var(--teal-pale);
    color:var(--teal-ink); font-family:inherit; font-size:12.5px; font-weight:600; padding:8px 14px;
    border-radius:11px; cursor:pointer; transition:.15s; white-space:nowrap;
  }
  .entry-btn:hover { filter:brightness(.97); }
  .entry-btn.armed { background:var(--teal); color:#fff; border-color:var(--teal); }
  .cards { display:flex; flex-direction:column; gap:8px; padding:14px; }

  /* card = espelha o RegistroCard real */
  .card {
    display:flex; align-items:center; gap:12px; padding:11px 14px; background:var(--surface);
    border:1px solid var(--border); border-radius:14px; transition:.15s; position:relative;
  }
  .card .body { min-width:0; flex:1; }
  .card .title { font-size:13px; font-weight:600; letter-spacing:-.005em; }
  .card .meta { font-size:11px; color:var(--text-2); margin-top:2px; }
  .card.inelig { opacity:.5; }
  .pill { display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:999px; white-space:nowrap; }
  .pill .pd { width:5px; height:5px; border-radius:50%; }
  .pill.coral { background:var(--coral-pale); color:var(--coral-ink); } .pill.coral .pd { background:var(--coral); }
  .pill.teal  { background:var(--teal-pale);  color:var(--teal-ink); }  .pill.teal .pd  { background:var(--teal); }
  .pill.slate { background:var(--slate-pale); color:var(--slate-ink); } .pill.slate .pd { background:var(--slate); }
  .fwd-badge { display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:600; padding:3px 5px 3px 9px; border-radius:999px; background:var(--surface-alt); color:var(--text-2); border:1px solid var(--border); white-space:nowrap; }
  .fwd-x { border:0; background:transparent; color:var(--text-3); font-size:13px; line-height:1; cursor:pointer; padding:0 3px; border-radius:50%; }
  .fwd-x:hover { background:var(--coral-pale); color:var(--coral-ink); }

  /* checkbox (inline B / listas) */
  .cbx { width:20px; height:20px; border:2px solid var(--border-strong); border-radius:6px; flex:none; display:grid; place-items:center; cursor:pointer; transition:.12s; background:var(--surface); }
  .cbx.on { background:var(--teal); border-color:var(--teal); }
  .cbx svg { width:12px; height:12px; stroke:#fff; stroke-width:3; fill:none; opacity:0; transition:.12s; }
  .cbx.on svg { opacity:1; }
  .card.selectable { cursor:pointer; }
  .card.selected { border-color:var(--teal); background:color-mix(in srgb, var(--teal-pale) 55%, var(--surface)); }

  /* ── overlay (modal / drawer / recipient-first) ─── */
  .scrim { position:fixed; inset:0; background:var(--scrim); backdrop-filter:blur(2px); z-index:80; opacity:0; animation:fade .18s forwards; }
  @keyframes fade { to { opacity:1; } }
  @keyframes rise { from { transform:translateY(12px); opacity:0; } to { transform:translateY(0); opacity:1; } }
  @keyframes slideR { from { transform:translateX(100%); } to { transform:translateX(0); } }

  .modal {
    position:fixed; z-index:90; left:50%; top:50%; transform:translate(-50%,-50%); width:min(460px,92vw);
    max-height:86vh; display:flex; flex-direction:column; background:var(--surface); border:1px solid var(--border);
    border-radius:18px; box-shadow:var(--shadow); animation:rise .2s ease; overflow:hidden;
  }
  .drawer {
    position:fixed; z-index:90; right:0; top:0; height:100%; width:min(420px,94vw); display:flex; flex-direction:column;
    background:var(--surface); border-left:1px solid var(--border); box-shadow:var(--shadow); animation:slideR .22s ease; overflow:hidden;
  }
  .panel-head { padding:16px 18px 12px; border-bottom:1px solid var(--border); display:flex; align-items:flex-start; gap:10px; }
  .panel-head .t { flex:1; }
  .panel-head .t h3 { font-size:15px; font-weight:700; letter-spacing:-.01em; }
  .panel-head .t p { font-size:11.5px; color:var(--text-3); margin-top:2px; }
  .x { border:0; background:transparent; color:var(--text-3); font-size:20px; line-height:1; cursor:pointer; padding:2px 6px; border-radius:8px; }
  .x:hover { background:var(--surface-alt); }
  .panel-tools { display:flex; align-items:center; justify-content:space-between; padding:10px 18px; border-bottom:1px solid var(--border); }
  .link-btn { border:0; background:transparent; color:var(--teal-ink); font-family:inherit; font-size:12px; font-weight:600; cursor:pointer; padding:2px 4px; }
  .link-btn:disabled { color:var(--text-3); cursor:default; }
  .count { font-size:11.5px; color:var(--text-2); font-weight:600; }
  .list { overflow-y:auto; padding:8px 12px; flex:1; display:flex; flex-direction:column; gap:6px; }
  .lrow { display:flex; align-items:center; gap:11px; padding:9px 10px; border-radius:11px; cursor:pointer; border:1px solid transparent; transition:.12s; }
  .lrow:hover { background:var(--surface-alt); }
  .lrow.on { background:color-mix(in srgb, var(--teal-pale) 55%, var(--surface)); border-color:var(--teal); }
  .lrow.dis { opacity:.45; cursor:default; }
  .lrow .lb { flex:1; min-width:0; }
  .lrow .lb .lt { font-size:12.5px; font-weight:600; }
  .lrow .lb .lm { font-size:10.5px; color:var(--text-3); margin-top:1px; }

  .panel-foot { padding:14px 18px; border-top:1px solid var(--border); display:flex; flex-direction:column; gap:10px; background:var(--surface); }
  .field label { display:block; font-size:11px; font-weight:600; color:var(--text-2); margin-bottom:5px; }
  select.dest, .fake-select {
    width:100%; font-family:inherit; font-size:13px; font-weight:500; color:var(--text-1); background:var(--surface-alt);
    border:1px solid var(--border-strong); border-radius:11px; padding:10px 12px; cursor:pointer; appearance:none;
    background-image:linear-gradient(45deg,transparent 50%,var(--text-3) 50%),linear-gradient(135deg,var(--text-3) 50%,transparent 50%);
    background-position:calc(100% - 18px) 55%, calc(100% - 13px) 55%; background-size:5px 5px,5px 5px; background-repeat:no-repeat;
  }
  .cta {
    width:100%; border:0; background:var(--teal); color:#fff; font-family:inherit; font-size:13.5px; font-weight:700;
    padding:12px; border-radius:12px; cursor:pointer; transition:.15s; display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .cta:hover { filter:brightness(1.05); }
  .cta:disabled { background:var(--surface-alt); color:var(--text-3); cursor:not-allowed; }

  /* recipient cards (variante D) */
  .dgrid { padding:12px 16px; display:flex; flex-direction:column; gap:8px; overflow-y:auto; }
  .dcard { display:flex; align-items:center; gap:12px; padding:12px 14px; border:1px solid var(--border); border-radius:13px; cursor:pointer; transition:.12s; }
  .dcard:hover { border-color:var(--teal-lt); background:var(--surface-alt); }
  .dcard.on { border-color:var(--teal); background:color-mix(in srgb, var(--teal-pale) 55%, var(--surface)); }
  .av { width:38px; height:38px; border-radius:50%; background:var(--teal-pale); color:var(--teal-ink); display:grid; place-items:center; font-weight:700; font-size:14px; flex:none; }
  .dcard .dn { font-size:13.5px; font-weight:600; } .dcard .de { font-size:11px; color:var(--text-3); }
  .steps { display:flex; gap:6px; align-items:center; font-size:11px; color:var(--text-3); font-weight:600; }
  .steps b { color:var(--teal-ink); }
  .back-btn { border:0; background:transparent; color:var(--text-2); font-family:inherit; font-size:12px; font-weight:600; cursor:pointer; padding:2px 4px; }

  /* action bar (variante B) */
  .actionbar {
    position:fixed; left:50%; bottom:20px; transform:translateX(-50%); z-index:70; width:min(680px,92vw);
    display:flex; align-items:center; gap:12px; padding:10px 12px 10px 16px; background:var(--surface);
    border:1px solid var(--border-strong); border-radius:16px; box-shadow:var(--shadow); animation:rise .2s ease;
  }
  .actionbar .cnt { font-size:12.5px; font-weight:700; }
  .actionbar .cnt span { color:var(--text-3); font-weight:500; }
  .actionbar select.dest { width:auto; min-width:150px; padding:8px 34px 8px 12px; font-size:12.5px; }
  .actionbar .cta { width:auto; padding:9px 16px; font-size:12.5px; }
  .actionbar .link-btn { white-space:nowrap; }

  /* toast */
  .toast {
    position:fixed; left:50%; bottom:28px; transform:translateX(-50%); z-index:120; background:var(--text-1); color:var(--bg);
    font-size:12.5px; font-weight:600; padding:11px 18px; border-radius:12px; box-shadow:var(--shadow); animation:rise .2s ease;
    display:flex; align-items:center; gap:9px; max-width:90vw;
  }
  .toast .tk { color:var(--teal-lt); }
  .hint { max-width:760px; margin:14px auto 0; padding:0 20px; font-size:11.5px; color:var(--text-3); }
  .hint b { color:var(--text-2); }
</style>
</head>
<body data-theme="light">

  <div class="topbar">
    <div><h1>R-04 · Encaminhar em lote</h1><div class="sub">4 direções de interação · mesma ficha · tokens reais</div></div>
    <div class="spacer"></div>
    <div class="tabs" id="tabs">
      <button class="tab on" data-v="A"><span class="k">A</span> Diálogo</button>
      <button class="tab" data-v="B"><span class="k">B</span> Modo seleção</button>
      <button class="tab" data-v="C"><span class="k">C</span> Painel lateral</button>
      <button class="tab" data-v="D"><span class="k">D</span> Destino 1º</button>
    </div>
    <button class="ghost-btn" id="themeBtn">☾ Escuro</button>
  </div>

  <div class="concept" id="concept"></div>

  <div class="stage">
    <div class="ficha">
      <div class="ficha-head">
        <div class="who"><div class="n">Ana Souza · 34a</div><div class="s">Plano de tratamento · 6 planejados · você é o autor</div></div>
        <div id="entry"></div>
      </div>
      <div class="cards" id="cards"></div>
    </div>
  </div>

  <p class="hint" id="hint"></p>

  <div id="overlay"></div>
  <div id="bar"></div>
  <div id="toast"></div>

<script>
(function(){
  const dentists = [
    { id:'d1', nome:'Dr. Bruno Alves',  esp:'Clínico geral' },
    { id:'d2', nome:'Dra. Camila Nunes', esp:'Endodontia' },
    { id:'d3', nome:'Dra. Teste R04',   esp:'Clínico geral' },
  ];
  const baseProcs = [
    { id:'p1', tipo:'Restauração', faces:'MOD', dente:16, status:'plan', elig:true },
    { id:'p2', tipo:'Restauração', faces:'O',   dente:26, status:'plan', elig:true },
    { id:'p3', tipo:'Restauração', faces:'DO',  dente:37, status:'plan', elig:true },
    { id:'p4', tipo:'Canal',       dente:21,    status:'plan', elig:true },
    { id:'p5', tipo:'Implante',    dente:46,    status:'plan', elig:true },
    { id:'p6', tipo:'Extração',    dente:48,    status:'plan', elig:true },
    { id:'p7', tipo:'Profilaxia',  nivel:'arcada superior', status:'done', elig:false },
    { id:'p8', tipo:'Restauração', faces:'M', dente:12, status:'plan', elig:true, fwd:'Dra. Camila Nunes' },
  ];

  const CONCEPTS = {
    A:{ n:'A · Diálogo Limpo', d:'Botão "Encaminhar" abre um diálogo central com a checklist dos planejados e o destinatário embaixo. Uma decisão de cada vez, foco total.', r:'Referência: Linear / Notion dialog · minimal-funcional' },
    B:{ n:'B · Modo Seleção (caixa de e-mail)', d:'"Encaminhar" liga um modo: cada card ganha checkbox no próprio lugar, os inelegíveis apagam, e uma barra de ação fixa embaixo junta contador + destino + confirmar.', r:'Referência: Gmail / Superhuman multi-select · sistêmico-denso' },
    C:{ n:'C · Painel Lateral', d:'Gaveta que entra pela direita: destinatário no topo, checklist abaixo, confirmar no rodapé — a ficha continua visível ao lado, sem perder contexto.', r:'Referência: Stripe / Linear side panel · expressivo-dedicado' },
    D:{ n:'D · Destino Primeiro', d:'Inverte o fluxo: escolhe PRA QUEM (cartões dos dentistas) e só então os procedimentos "acendem" pra marcar. Espelha o "passa isso pro Dr. X".', r:'Referência: iOS Share sheet / Figma share · inesperado-criativo' },
  };
  const HINTS = {
    A:'Experimente: <b>Selecionar tudo</b> → desmarque Implante e Canal → escolha o destino → Encaminhar.',
    B:'Experimente: clique <b>Encaminhar</b> pra entrar no modo, use <b>Selecionar tudo</b> e desmarque os 2 que você fica.',
    C:'A ficha fica visível atrás — dá pra conferir enquanto marca. Note o destinatário no topo, não no fim.',
    D:'Escolha o dentista primeiro; repare como o modelo mental vira "pra quem eu passo" antes de "o quê".',
  };

  const state = { v:'A', theme:'light', mode:false, sel:new Set(), dest:'', panel:null, step:1, procs:null };
  function reset(){ state.procs = baseProcs.map(p=>({...p})); state.sel=new Set(); state.dest=''; state.mode=false; state.panel=null; state.step=1; }
  reset();

  const $ = s=>document.querySelector(s);
  const elig = ()=> state.procs.filter(p=>p.elig && !p.fwd);
  const pillOf = p => p.status==='done' ? ['teal','Realizado'] : p.status==='pre' ? ['slate','Pré-existente'] : ['coral','Planejado'];
  const titleOf = p => `${p.tipo}${p.faces?' '+p.faces:''} · ${p.dente?('dente '+p.dente):(p.nivel||'')}`;
  const check = `<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>`;

  function toast(msg){
    $('#toast').innerHTML = `<div class="toast"><span class="tk">✓</span>${msg}</div>`;
    clearTimeout(toast._t); toast._t = setTimeout(()=>{ $('#toast').innerHTML=''; }, 3200);
  }
  function confirmSend(){
    const ids=[...state.sel]; const dn = dentists.find(d=>d.id===state.dest)?.nome || '';
    if(!ids.length || !dn) return;
    state.procs.forEach(p=>{ if(state.sel.has(p.id)) p.fwd = dn; });
    toast(`${ids.length} procedimento${ids.length>1?'s':''} encaminhado${ids.length>1?'s':''} a ${dn}`);
    reset(); render();
  }

  // ── cards da ficha (fundo) ──────────────────────────
  function renderCards(){
    const wrap = $('#cards'); wrap.innerHTML='';
    state.procs.forEach(p=>{
      const [pc,pl]=pillOf(p);
      const selectable = state.v==='B' && state.mode && p.elig && !p.fwd;
      const on = state.sel.has(p.id);
      const c=document.createElement('div');
      c.className = `card${!p.elig?' inelig':''}${selectable?' selectable':''}${on?' selected':''}`;
      c.innerHTML =
        (selectable?`<div class="cbx${on?' on':''}">${check}</div>`:'')+
        `<div class="body"><div class="title">${titleOf(p)}</div><div class="meta">Você · CRO-SP 12345</div></div>`+
        (p.fwd?`<span class="fwd-badge">⤳ ${p.fwd}${(!state.mode)?`<button class="fwd-x" data-rm="${p.id}" title="Remover encaminhamento (só o autor vê)">&times;</button>`:''}</span>`:'')+
        `<span class="pill ${pc}"><span class="pd"></span>${pl}</span>`;
      if(selectable) c.onclick=()=>{ on?state.sel.delete(p.id):state.sel.add(p.id); render(); };
      const rmBtn=c.querySelector('.fwd-x');
      if(rmBtn) rmBtn.onclick=(e)=>{ e.stopPropagation(); const who=p.fwd; p.fwd=null; toast(`Encaminhamento a ${who} removido`); render(); };
      wrap.appendChild(c);
    });
  }

  // ── entry button (varia por variante) ──────────────
  function renderEntry(){
    const e=$('#entry');
    if(state.v==='B' && state.mode){ e.innerHTML=''; return; }
    const label = state.v==='D' ? '⤳ Encaminhar' : '⤳ Encaminhar';
    e.innerHTML = `<button class="entry-btn">${label}</button>`;
    e.querySelector('button').onclick = ()=>{
      if(state.v==='A'){ state.panel='modal'; }
      else if(state.v==='B'){ state.mode=true; }
      else if(state.v==='C'){ state.panel='drawer'; }
      else if(state.v==='D'){ state.panel='recipient'; state.step=1; }
      render();
    };
  }

  // ── lista de checklist reutilizável (A / C / D-step2) ─
  function checklistHTML(){
    return state.procs.map(p=>{
      if(!p.elig) return `<div class="lrow dis"><div class="cbx" style="visibility:hidden"></div><div class="lb"><div class="lt">${titleOf(p)}</div><div class="lm">Realizado — não encaminhável</div></div><span class="pill teal"><span class="pd"></span>Realizado</span></div>`;
      const already = !!p.fwd; const on = state.sel.has(p.id) || already;
      return `<div class="lrow${on?' on':''}${already?' dis':''}" data-id="${p.id}">
        <div class="cbx${on?' on':''}">${check}</div>
        <div class="lb"><div class="lt">${titleOf(p)}</div><div class="lm">${already?('já com '+p.fwd):'planejado'}</div></div>
      </div>`;
    }).join('');
  }
  function wireChecklist(root){
    root.querySelectorAll('.lrow[data-id]').forEach(r=>{
      r.onclick=()=>{ const id=r.dataset.id; state.sel.has(id)?state.sel.delete(id):state.sel.add(id); render(); };
    });
  }
  function selAllTools(){
    const all = elig(); const allOn = all.length>0 && all.every(p=>state.sel.has(p.id));
    return { allOn, count:state.sel.size,
      toggle:()=>{ if(allOn){ all.forEach(p=>state.sel.delete(p.id)); } else { all.forEach(p=>state.sel.add(p.id)); } render(); } };
  }
  function destSelectHTML(){
    return `<select class="dest" id="destSel"><option value="">Escolher destinatário…</option>`+
      dentists.map(d=>`<option value="${d.id}"${state.dest===d.id?' selected':''}>${d.nome} · ${d.esp}</option>`).join('')+`</select>`;
  }

  // ── overlays ────────────────────────────────────────
  function renderOverlay(){
    const o=$('#overlay'); o.innerHTML='';
    if(!state.panel){ return; }
    const scrim=document.createElement('div'); scrim.className='scrim';
    scrim.onclick=()=>{ state.panel=null; state.sel.clear(); state.dest=''; render(); };
    o.appendChild(scrim);
    const t=selAllTools();

    if(state.panel==='modal' || state.panel==='drawer'){
      const box=document.createElement('div'); box.className = state.panel==='modal'?'modal':'drawer';
      box.innerHTML =
        `<div class="panel-head"><div class="t"><h3>Encaminhar procedimentos</h3><p>Marque o que passa pra outro dentista — 1 destinatário pro lote.</p></div><button class="x">&times;</button></div>`+
        `<div class="panel-tools"><span class="count">${t.count} selecionado${t.count!==1?'s':''}</span><button class="link-btn" id="allBtn">${t.allOn?'Limpar':'Selecionar tudo'}</button></div>`+
        `<div class="list">${checklistHTML()}</div>`+
        `<div class="panel-foot"><div class="field"><label>Encaminhar para</label>${destSelectHTML()}</div>`+
        `<button class="cta" id="send"${(t.count&&state.dest)?'':' disabled'}>Encaminhar ${t.count||''} ${t.count?('procedimento'+(t.count>1?'s':'')):''} ⤳</button></div>`;
      o.appendChild(box);
      box.querySelector('.x').onclick=scrim.onclick;
      box.querySelector('#allBtn').onclick=t.toggle;
      box.querySelector('#destSel').onchange=e=>{ state.dest=e.target.value; render(); };
      box.querySelector('#send').onclick=confirmSend;
      wireChecklist(box);
    }

    if(state.panel==='recipient'){
      const box=document.createElement('div'); box.className='modal';
      if(state.step===1){
        box.innerHTML =
          `<div class="panel-head"><div class="t"><h3>Encaminhar para quem?</h3><p>Escolha o dentista — depois você marca o que passa pra ele.</p></div><button class="x">&times;</button></div>`+
          `<div class="dgrid">`+ dentists.map(d=>`<div class="dcard${state.dest===d.id?' on':''}" data-id="${d.id}"><div class="av">${d.nome.split(' ').slice(-1)[0][0]}</div><div><div class="dn">${d.nome}</div><div class="de">${d.esp}</div></div></div>`).join('') +`</div>`+
          `<div class="panel-foot"><div class="steps"><b>1. Destino</b> › <span>2. Procedimentos</span></div></div>`;
        o.appendChild(box);
        box.querySelectorAll('.dcard').forEach(c=>c.onclick=()=>{ state.dest=c.dataset.id; state.step=2; render(); });
      } else {
        const dn=dentists.find(d=>d.id===state.dest);
        box.innerHTML =
          `<div class="panel-head"><div class="t"><h3>O que passa pra ${dn.nome.split(' ').slice(0,2).join(' ')}?</h3><p>Marque os planejados — "selecionar tudo" e tire os que você fica.</p></div><button class="x">&times;</button></div>`+
          `<div class="panel-tools"><button class="back-btn" id="back">‹ trocar destino</button><button class="link-btn" id="allBtn">${t.allOn?'Limpar':'Selecionar tudo'}</button></div>`+
          `<div class="list">${checklistHTML()}</div>`+
          `<div class="panel-foot"><div class="steps"><span>1. Destino ✓</span> › <b>2. Procedimentos</b></div>`+
          `<button class="cta" id="send"${t.count?'':' disabled'}>Encaminhar ${t.count||''} a ${dn.nome.split(' ')[0]} ⤳</button></div>`;
        o.appendChild(box);
        box.querySelector('#back').onclick=()=>{ state.step=1; render(); };
        box.querySelector('#allBtn').onclick=t.toggle;
        box.querySelector('#send').onclick=confirmSend;
        wireChecklist(box);
      }
      box.querySelector('.x').onclick=scrim.onclick;
    }
  }

  // ── action bar (variante B) ────────────────────────
  function renderBar(){
    const b=$('#bar'); b.innerHTML='';
    if(!(state.v==='B' && state.mode)) return;
    const t=selAllTools();
    const bar=document.createElement('div'); bar.className='actionbar';
    bar.innerHTML =
      `<div class="cnt">${t.count} <span>selecionado${t.count!==1?'s':''}</span></div>`+
      `<button class="link-btn" id="allBtn">${t.allOn?'Limpar':'Selecionar tudo'}</button>`+
      `<div class="spacer"></div>`+
      destSelectHTML()+
      `<button class="cta" id="send"${(t.count&&state.dest)?'':' disabled'}>Encaminhar ⤳</button>`+
      `<button class="x" id="cancel" title="Sair do modo">&times;</button>`;
    b.appendChild(bar);
    bar.querySelector('#allBtn').onclick=t.toggle;
    bar.querySelector('#destSel').onchange=e=>{ state.dest=e.target.value; render(); };
    bar.querySelector('#send').onclick=confirmSend;
    bar.querySelector('#cancel').onclick=()=>{ state.mode=false; state.sel.clear(); state.dest=''; render(); };
  }

  function renderConcept(){
    const c=CONCEPTS[state.v];
    $('#concept').innerHTML=`<div class="dot"></div><div><h2>${c.n}</h2><p>${c.d}</p><div class="ref">${c.r}</div></div>`;
    $('#hint').innerHTML = HINTS[state.v];
  }

  function render(){ renderConcept(); renderEntry(); renderCards(); renderOverlay(); renderBar(); }

  // ── controls ───────────────────────────────────────
  $('#tabs').querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
    $('#tabs').querySelector('.on').classList.remove('on'); t.classList.add('on');
    state.v=t.dataset.v; reset(); render();
  });
  $('#themeBtn').onclick=()=>{
    state.theme = state.theme==='light'?'dark':'light';
    document.body.dataset.theme=state.theme;
    $('#themeBtn').textContent = state.theme==='light'?'☾ Escuro':'☀ Claro';
  };

  render();
})();
</script>
</body>
</html>
