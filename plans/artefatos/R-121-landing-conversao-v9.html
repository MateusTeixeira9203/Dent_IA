<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Odonto.IA — Landing V9</title>
  <style>html,body,#stage{width:100%;height:100%;margin:0;border:0;background:#0d0e0e;overflow:hidden}</style>
</head>
<body>
  <iframe id="stage" src="./R-121-landing-conversao-v8.html" title="Landing Odonto.IA V9"></iframe>
  <script>
    const frame=document.querySelector('#stage');
    function deepestDocument(){
      let doc=frame.contentDocument;
      while(doc){const nested=doc.querySelector('#stage');if(!nested)return doc;doc=nested.contentDocument}
      return null;
    }
    const wait=setInterval(()=>{
      const doc=deepestDocument(); const content=doc?.querySelector('#preco .conteudo');
      if(!content)return;
      clearInterval(wait);
      content.innerHTML=`
        <h2>Entre na primeira turma como Fundador.</h2>
        <p class="founderLead">Dois caminhos para começar. O mesmo Odonto.IA completo e o mesmo preço de lançamento.</p>
        <div class="founderPlans">
          <article class="founderPlan">
            <span class="founderBadge">Plano Fundador</span>
            <h3>Consultório</h3>
            <p class="founderContext">Para quem atende sozinho</p>
            <strong>R$200 <small>/ mês</small></strong>
            <p class="founderDescription">1 dentista + 1 secretária. Valor mantido enquanto a assinatura permanecer ativa.</p>
            <button>G &nbsp; Começar com Google</button>
          </article>
          <article class="founderPlan founderPlan--clinic">
            <span class="founderBadge">Plano Fundador</span>
            <h3>Clínica</h3>
            <p class="founderContext">A partir de 2 dentistas</p>
            <strong>R$200 <small>/ dentista / mês</small></strong>
            <p class="founderDescription">Cada dentista cuida do seu fluxo, com pacientes e ferramentas compartilhadas pela clínica.</p>
            <button>G &nbsp; Começar com Google</button>
          </article>
        </div>
        <p class="founderFoot">7 dias gratuitos antes da primeira cobrança · condição limitada às próximas 10 vagas</p>`;
      const style=doc.createElement('style');
      style.textContent=`
        .founderLead{max-width:50rem;margin:15px 0 28px;color:var(--tx2);font-size:17px;line-height:1.55}
        .founderPlans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
        .founderPlan{min-height:360px;display:flex;flex-direction:column;align-items:flex-start;padding:30px;border:1px solid var(--fio-forte);border-radius:16px;background:color-mix(in srgb,var(--surface) 90%,transparent)}
        .founderPlan--clinic{border-color:color-mix(in srgb,var(--teal) 50%,var(--fio-forte));background:linear-gradient(135deg,color-mix(in srgb,var(--teal) 11%,var(--surface)),var(--surface))}
        .founderBadge{padding:5px 7px;border:1px solid color-mix(in srgb,var(--teal) 45%,transparent);border-radius:5px;color:var(--teal-ac);font:700 9px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase}
        .founderPlan h3{margin-top:24px;font-size:30px}.founderContext{margin-top:5px;color:var(--tx2);font-size:14px}.founderPlan strong{margin-top:18px;font:400 44px/.95 var(--serif);letter-spacing:-.04em}.founderPlan strong small{font:400 14px/1 var(--sans);letter-spacing:0;color:var(--tx2)}
        .founderDescription{max-width:34ch;margin-top:18px;color:var(--tx2);font-size:14px;line-height:1.55}.founderPlan button{margin-top:auto;border:0;border-radius:10px;background:#fff;color:#1f1f1f;padding:12px 16px;font:600 14px/1 var(--sans)}
        .founderFoot{margin-top:16px;color:var(--teal-ac);font:700 10px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase}
        @media(max-width:680px){.founderPlans{grid-template-columns:1fr}.founderPlan{min-height:0}.founderPlan strong{font-size:38px}}
      `;
      doc.head.appendChild(style);
    },60);
  </script>
</body>
</html>
