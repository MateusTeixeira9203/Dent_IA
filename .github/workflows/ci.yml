name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # TODO(R-25): erros pré-existentes de react-hooks/set-state-in-effect.
      # Testes, typecheck e build são gates duros; lint continua diagnóstico até a limpeza.
      # tirar o continue-on-error quando esses forem corrigidos.
      - run: npm run lint
        continue-on-error: true

      - run: npm run build
